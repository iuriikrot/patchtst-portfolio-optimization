# Конфигурация эксперимента patchtst-portfolio-optimization
# Применение PatchTST для портфельной оптимизации Марковица

# Воспроизводимость результатов
random_seed: 42

# Параметры данных
data:
  tickers:                          # 20 акций из 10 секторов S&P 500
    # Technology (3)
    - AAPL
    - MSFT
    - INTC
    # Healthcare (3)
    - JNJ
    - UNH
    - PFE
    # Financials (3)
    - JPM
    - WFC
    - GS
    # Energy (2)
    - XOM
    - CVX
    # Consumer Staples (2)
    - PG
    - KO
    # Industrials (2)
    - CAT
    - MMM
    # Consumer Discretionary (2)
    - HD
    - MCD
    # Utilities (1)
    - DUK
    # Communication Services (1)
    - VZ
    # Materials (1)
    - NEM
  start_date: "2000-01-01"
  end_date: "2026-01-15"
  price_column: "Adj Close"
  benchmark_ticker: "SPY"           # Бенчмарк buy-and-hold (качается отдельно)

# Параметры бэктестинга
backtest:
  train_window: 1260                # 5 лет (252 * 5)
  test_window: 21                   # 1 месяц
  data_end: null                    # Обрезать данные до даты (ISO). Для тюнинга
                                    # по validation-периоду: "2015-02-01" —
                                    # validation_end + ~1 месяц, чтобы пограничный
                                    # месяц (ребалансировка в декабре 2014) успел
                                    # реализоваться целиком и попасть в validation

# Параметры моделей
models:
  arima:
    max_p: 3
    max_d: 1
    max_q: 3
    stepwise: true

  patchtst:
    mode: "full"                    # fast | full
    n_workers: 1                    # Параллельных CPU-процессов по тикерам;
                                    # 1 = последовательно на MPS/GPU.
                                    # Замер на M4 Air: MPS (48 с/окно) быстрее и
                                    # 8 CPU-воркеров (141 с), и 4 процессов на общем
                                    # MPS (1.2x) — GPU насыщен. >1 имеет смысл только
                                    # на машинах с большим числом быстрых ядер без GPU.
    padding_patch: true             # ReplicationPad в конце окна (официальная
                                    # реализация): без него последние дни окна
                                    # не попадают в патчи. false = старое поведение.
                                    # Влияет на обе PatchTST-стратегии.

    # Быстрый режим (для отладки)
    fast:
      input_length: 252
      pred_length: 21
      patch_length: 21
      stride: 21
      d_model: 64
      n_heads: 4
      n_layers: 2
      d_ff: 256
      dropout: 0.2
      use_revin: true
      mask_ratio: 0.4
      pretrain_epochs: 3
      finetune_epochs: 3
      pretrain_lr: 0.0001
      batch_size: 64

    # Полный режим
    full:
      input_length: 252             # 1 год
      pred_length: 21               # 1 месяц
      patch_length: 16
      stride: 8
      d_model: 128
      n_heads: 16
      n_layers: 3
      d_ff: 512
      dropout: 0.1
      use_revin: true
      mask_ratio: 0.15
      pretrain_epochs: 20
      finetune_epochs: 10
      pretrain_lr: 0.005
      batch_size: 64

  # Декомпозиция ICEEMDAN для стратегии PatchTST + ICEEMDAN.
  # Архитектура сети наследуется из models.patchtst.{mode}
  iceemdan:
    trials: 50                      # Число реализаций шумового ансамбля CEEMDAN
    epsilon: 0.2                    # Амплитуда добавляемого шума (доля std сигнала)
    seed: 42                        # Seed шумового ансамбля (воспроизводимость)
    max_imf: -1                     # -1 = без ограничения числа IMF
    grouping:                       # Детерминированная группировка IMF в 3 канала
      noise_max_period: 5           # Средний период < 5 дней  -> noise
      cycle_max_period: 63          # 5..63 дня -> cycle; > 63 и residue -> trend
    forecast_noise: true            # false = денойзинг: noise-канал в прогнозе -> 0
    cache:
      enabled: true
      dir: "data/cache/iceemdan"    # Кэш декомпозиций (ключ = хэш окна + параметры)

# Параметры оценки результатов
evaluation:
  transaction_costs:
    cost_rate: 0.0005               # 5 б.п. на единицу оборота; метрики
                                    # считаются с издержками (net) и без (gross)
  split:
    validation_end: "2014-12-31"    # Тестовые месяцы <= даты = validation (тюнинг
                                    # гиперпараметров), после = holdout (финальная оценка)

# Параметры оптимизации Марковица
optimization:
  risk_free_rate: 0.04              # 4% годовых
  covariance: "ledoit_wolf"         # sample | ledoit_wolf

  constraints:
    long_only: true
    fully_invested: true
    max_weight: 0.2                 # Максимум 20% на актив
    min_weight: 0.01                # Минимум 1% на актив
    gross_exposure: 1.5             # Только при long_only=false
